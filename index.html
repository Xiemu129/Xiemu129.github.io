<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Xiemu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --item: #f5f5f7;
      --text-main: #1d1d1f;
      --text-secondary: #6e6e73;
      --divider: #e5e5e7;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --card: #16181d;
        --item: #1c1f26;
        --text-main: #f5f5f7;
        --text-secondary: #9a9aa0;
        --divider: #2c2f36;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 80px 24px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* 移动端：收窄内边距，内容依然保持居中 */
    @media (max-width: 640px) {
      body {
        padding: 32px 20px;
      }

      .card {
        padding: 28px 20px;
      }
    }

    .page {
      width: 100%;
      max-width: 560px;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 32px;
      box-shadow: var(--shadow);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .header {
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .role {
      margin-top: 6px;
      font-size: 17px;
      color: var(--text-secondary);
    }

    .section {
      margin-top: 28px;
    }

    .section-title {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .contact-item {
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--item);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.3s ease;
    }

    .contact-item a {
      color: var(--text-main);
      text-decoration: none;
      font-weight: 500;
    }

    .contact-item a:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: 32px;
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="card">
      <div class="header">
        <h1>谢幕</h1>
<div class="role">
  iOS Developer · Objective-C · Swift
</div>
      </div>

      <div class="section">
        <div class="section-title">联系</div>
        <div class="contact-list">
          <div class="contact-item">
            <span>QQ</span>
            <a>1041291</a>
          </div>

          <div class="contact-item">
            <span>Email</span>
            <a href="mailto:admin@xiemux.com" target="_self">admin@xiemux.com</a>
          </div>

          <div class="contact-item">
            <span>GitHub</span>
            <a href="https://github.com/Xiemu129" target="_blank">Xiemu</a>
          </div>

          <div class="contact-item">
            <span>WeChat</span>
            <a>z2w0129</a>
          </div>

          <div class="contact-item">
            <span>Telegram</span>
            <a href="https://t.me/Solatre1" target="_self">Solatre1</a>
          </div>
        </div>
      </div>
    </div>

    <footer>
      © 2018–2026 Xiemu
    </footer>
  </div>
</body>
</html>
